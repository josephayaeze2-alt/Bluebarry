<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>blueberry</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body {
            background: #0a0a0a;
            color: #a3a3a3;
            font-family: "SF Mono", "Fira Code", "Roboto Mono", Menlo, Consolas, monospace;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        /* Stripped down logo */
        .logo {
            font-size: 1rem;
            font-weight: 400;
            color: #e5e5e5;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
            text-transform: lowercase;
        }
        
        .logo span { 
            color: #525252; 
        }

        /* Terminal style search box */
        .search-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .prompt {
            color: #4a6cf7; /* Keeping a subtle nod to your original blue */
            font-size: 1rem;
            user-select: none;
        }

        form {
            flex: 1;
            display: flex;
        }

        input[type="text"] {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-family: inherit;
            font-size: 1rem;
            caret-color: #4a6cf7;
        }

        input::placeholder {
            color: #333333;
        }

        /* Hide the button visually, keep it for accessibility/enter key */
        button {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        /* Minimal footer */
        .footer {
            position: fixed;
            bottom: 20px;
            left: 20px;
            font-size: 0.75rem;
            color: #262626;
        }

        .shortcuts {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 0.75rem;
            color: #262626;
        }

        /* Subtle selection color */
        ::selection {
            background: #4a6cf7;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">blue<span>berry</span></div>
        
        <div class="search-wrapper">
            <span class="prompt">~$</span>
            <form id="searchForm" action="https://search.brave.com/search" method="GET" target="_blank">
                <input 
                    type="text" 
                    name="q" 
                    id="searchInput" 
                    placeholder="type to search..." 
                    autocomplete="off" 
                    spellcheck="false"
                    required
                >
                <button type="submit">Search</button>
            </form>
        </div>
    </div>

    <div class="footer">brave search</div>
    <div class="shortcuts">[ / ] focus &nbsp; [ esc ] blur</div>

    <script>
        const searchForm = document.getElementById('searchForm');
        const searchInput = document.getElementById('searchInput');

        window.addEventListener('DOMContentLoaded', () => {
            searchInput.focus();
        });

        searchForm.addEventListener('submit', (e) => {
            const query = searchInput.value.trim();
            if (!query) {
                e.preventDefault();
                return;
            }
            searchInput.value = query;
        });

        document.addEventListener('keydown', (e) => {
            // Pressing '/' focuses the input
            if (e.key === '/' && document.activeElement !== searchInput) {
                e.preventDefault();
                searchInput.focus();
            }
            // Pressing 'Escape' blurs the input
            if (e.key === 'Escape') {
                searchInput.blur();
                searchInput.value = '';
            }
        });
    </script>
</body>
</html>
